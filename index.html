<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Vania</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --night:#0e1024; --dusk:#2b1a3d; --warm:#ffb764; --paper:#f6e7d2; }
  html, body { height: 100%; }
  body { background: linear-gradient(180deg, var(--night), var(--dusk)); color: var(--paper); font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; text-align: center; z-index: 2; }

  /* glow that grows when the candle is lit */
  #glow { position: fixed; inset: 0; z-index: 1; opacity: 0; transition: opacity 2.2s;
    background: radial-gradient(circle at 50% 30%, rgba(255,183,100,.35), rgba(255,183,100,0) 55%); }
  body.lit #glow { opacity: 1; }
  body.out #glow { opacity: .25; }

  /* candle */
  .candle { position: relative; width: 34px; height: 120px; cursor: pointer; margin-bottom: 2rem; }
  .wax { position: absolute; bottom: 0; left: 0; right: 0; height: 90px; background: linear-gradient(90deg, #efe0c8, #fff7ea 45%, #e2cfb0); border-radius: 6px 6px 4px 4px; }
  .wick { position: absolute; bottom: 88px; left: 50%; width: 2px; height: 12px; margin-left: -1px; background: #3a2a22; }
  .flame { position: absolute; bottom: 98px; left: 50%; width: 18px; height: 34px; margin-left: -9px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(ellipse at 50% 75%, #fff3c4 0%, #ffc15e 45%, #ff8a3d 100%); box-shadow: 0 0 24px 8px rgba(255,170,80,.55);
    transform-origin: 50% 100%; opacity: 0; transform: scale(.2); transition: opacity .8s, transform .8s; }
  body.lit .flame { opacity: 1; transform: scale(1); animation: flicker 1.4s infinite ease-in-out .8s; }
  body.out .flame { opacity: 0; transform: scale(.1); animation: none; transition: opacity .6s, transform .6s; }
  @keyframes flicker { 0%,100% { transform: scale(1) rotate(-2deg); } 35% { transform: scale(1.06,.96) rotate(2deg); } 65% { transform: scale(.96,1.05) rotate(-1deg); } }
  .candle.idle { animation: nudge 2.4s infinite ease-in-out; }
  @keyframes nudge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* text */
  #line { font-family: 'Fraunces', Georgia, serif; font-size: clamp(1.35rem, 5.2vw, 2rem); line-height: 1.45; max-width: 520px; min-height: 9.5rem; display: flex; align-items: center; justify-content: center; transition: opacity .9s; }
  #line.fade { opacity: 0; }
  #line strong { font-weight: 700; }
  .hint { opacity: .6; font-size: .95rem; }
  .btn-soft { border: 1px solid rgba(246,231,210,.45); color: var(--paper); background: transparent; padding: .6rem 1.9rem; font-weight: 500; transition: .3s; }
  .btn-soft:hover, .btn-soft:active { background: var(--paper); color: var(--night); }
  .dots { display: flex; gap: 7px; margin: 1.2rem 0; height: 6px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(246,231,210,.2); transition: .6s; }
  .dots i.on { background: var(--warm); }

  /* drifting lights */
  .spark { position: fixed; width: 4px; height: 4px; border-radius: 50%; background: var(--warm); opacity: 0; z-index: 1; animation: drift linear infinite; }
  @keyframes drift { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .7; } 100% { transform: translateY(-110vh); opacity: 0; } }
  body:not(.lit) .spark { display: none; }
</style>
</head>
<body>
<div id="glow"></div>

<main class="stage">
  <div class="candle idle" id="candle" role="button" aria-label="Light the candle">
    <div class="flame"></div><div class="wick"></div><div class="wax"></div>
  </div>

  <div id="line"><span class="hint">Hi <span class="who">friend</span> Pencet lilin nya. (pake headset)</span></div>
  <div class="dots" id="dots"></div>
  <button class="btn btn-soft rounded-pill" id="go" style="display:none">next</button>
</main>

<script>
const CONFIG = {
  song: "song.mp3",
  name: "Vania",
  from: "Qolby",
  lines: [
    "Hai van, waktu itu kamu bilang kamu nggak mau di rayain ulang tahunnya jadi aku ngga ngerayain cuma mau kasih surprise dari website kecil ini yang ku buat pas ku lagi ujian hehe",
    "kita udah temenan hampir 3 tahun gila sih berawal dari ketemu di roblox terus main phasmophobia sampe server nya penuh dengan orang orang aneh terus mati lagi servernya wkwkkw",
    "banyak banget drama kita dari orang paling deket atau drama di server yang gajelas banget jir arahnya",
    "aku mau bilang makasih yah van udah nemenin aku vc biar ada temen ngobrol, curhat, atau bahkan liatin aku main game game aneh.",
    "kemaren pas kamu bilang tahun depan mau ke tangerang aku seneng van, karna salah satu wishlist ku adlah ketemu kamu, so pls jadikan mweheheh.",
    "t-t-tapi jangan bilang bilang yah soal ini kesiapapun! A-awas aja ya kalo bilang bilang soal ini Hmph!",
    "last, i don't want to lose our friendship van, **please stay with me** :)"
  ],
  closing: "Love you sis Vania.\nFrom Qolby."
};

document.querySelectorAll('.who').forEach(e => e.textContent = CONFIG.name);
CONFIG.closing = CONFIG.closing.replace(/Kaz/g, CONFIG.from);

const body = document.body, candle = document.getElementById('candle');
const line = document.getElementById('line'), go = document.getElementById('go'), dotsEl = document.getElementById('dots');
dotsEl.innerHTML = CONFIG.lines.map(() => '<i></i>').join('');
let at = -1, busy = false;

// music
const music = new Audio(CONFIG.song);
music.loop = true; music.volume = 0;
function fadeTo(target, ms) {
  const from = music.volume, t0 = performance.now();
  (function tick(now) {
    const k = Math.min((now - t0) / ms, 1);
    music.volume = from + (target - from) * k;
    if (k < 1) requestAnimationFrame(tick);
    else if (target === 0) music.pause();
  })(t0);
}

function say(text, after) {
  line.classList.add('fade');
  setTimeout(() => { line.innerHTML = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); line.style.whiteSpace = 'pre-line'; line.classList.remove('fade'); if (after) after(); }, 900);
}

// drifting lights
for (let i = 0; i < 22; i++) {
  const s = document.createElement('div'); s.className = 'spark';
  s.style.left = Math.random() * 100 + 'vw'; s.style.top = (60 + Math.random() * 50) + 'vh';
  s.style.animationDuration = (9 + Math.random() * 9) + 's'; s.style.animationDelay = (-Math.random() * 12) + 's';
  document.body.appendChild(s);
}

// light the candle
candle.addEventListener('click', () => {
  if (!body.classList.contains('lit')) {
    candle.classList.remove('idle');
    body.classList.add('lit');
    music.play().then(() => fadeTo(0.6, 4000)).catch(() => {});
    setTimeout(() => step(), 1600);
    return;
  }
});

function step() {
  at++;
  [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k <= at));
  go.style.display = 'none';
  say(CONFIG.lines[at], () => {
    setTimeout(() => {
      go.style.display = 'inline-block';
      go.textContent = at === CONFIG.lines.length - 1 ? 'Tiup' : 'Next';
    }, 1200);
  });
}

go.addEventListener('click', () => {
  if (at < CONFIG.lines.length - 1) return step();
  go.style.display = 'none';
  body.classList.add('out');
  setTimeout(() => say(CONFIG.closing), 1200);
  setTimeout(() => fadeTo(0, 6000), 6000);
});
</script>
</body>
</html>
